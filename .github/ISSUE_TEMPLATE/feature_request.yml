name: 请求开发新的功能
description: 提议一个新的功能或改进方向
title: '[Function] '
labels:
  - enhancement
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已更新至最新版插件(![NPM Version](https://img.shields.io/npm/v/fraq-plugin-lexicon?label=lexicon))，但仍然没有我想要的功能
          required: true
  - type: textarea
    id: feature-description
    attributes:
      label: 详细描述你需要什么功能
      description: 请说明使用场景、期望行为以及它要解决的问题。
      placeholder: 请详细描述你希望增加的功能
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 附加内容
      description: 可以补充示例、截图、参考资料或其他建议。
      placeholder: 请输入其他有帮助的信息
    validations:
      required: false
