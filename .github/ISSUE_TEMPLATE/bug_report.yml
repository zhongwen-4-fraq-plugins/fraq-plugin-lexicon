name: 提交 BUG
description: 报告一个可以复现的问题
title: '[BUG] '
labels:
  - bug
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已更新至**最新版**词库插件(![NPM Version](https://img.shields.io/npm/v/fraq-plugin-lexicon?label=lexicon))和 FRAQ(![NPM Version](https://img.shields.io/npm/v/%40fraqjs%2Ffraq?label=Fraq)) 框架，但 BUG 仍然存在
          required: true
        - label: 我已阅读[issue列表](https://github.com/zhongwen-4-fraq-plugins/fraq-plugin-lexicon/issues)，但仍未找到对应的解决方法
          required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: 请粘贴完整错误日志，不要截断关键信息。
      placeholder: 请将错误日志粘贴到这里
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序描述触发 BUG 所需的操作和配置。
      placeholder: |
        1. 使用了什么版本？
        2. 执行了什么操作？
        3. 出现了什么结果？
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 附加内容
      description: 可以补充截图、配置片段、运行环境或其他相关信息。
      placeholder: 请输入其他有帮助的信息
    validations:
      required: false
