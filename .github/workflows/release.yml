name: 发布 GitHub Release

on:
  workflow_run:
    workflows: ['发布 npm 包']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: 生成发布说明并创建 Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出发布提交
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 校验发布标签
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git fetch --force --tags origin
          TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
            echo "标签 $RELEASE_TAG 未指向已发布提交 $RELEASE_SHA。" >&2
            exit 1
          fi

      - name: 生成发布说明
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          node .github/scripts/generate-release-notes.mjs "$RELEASE_TAG" > release-notes.md
          cat release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          RELEASE_TITLE="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi
