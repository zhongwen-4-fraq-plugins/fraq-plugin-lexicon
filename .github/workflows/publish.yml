name: 发布 npm 包

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: 测试、构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: 校验发布标签
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ github.ref_name }}"

          if [[ "$RELEASE_TAG" != "$PACKAGE_VERSION" && "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "发布标签必须是 $PACKAGE_VERSION 或 v$PACKAGE_VERSION，当前为 $RELEASE_TAG。" >&2
            exit 1
          fi

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

      - name: 检查代码
        run: pnpm check

      - name: 构建包
        run: pnpm build

      - name: 发布到 npm
        run: npm publish

  release_base:
    name: 检查历史发布状态
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      base_tag: ${{ steps.history.outputs.base_tag }}

    steps:
      - name: 检出发布历史
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 查找最近成功发布的标签
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          BASE_TAG="$(node .github/scripts/find-release-base.mjs "$RELEASE_TAG")"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"

  release:
    name: 生成发布说明并创建 Release
    needs: release_base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 检出发布提交
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 生成发布说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BASE_TAG: ${{ needs.release_base.outputs.base_tag }}
        shell: bash
        run: |
          node .github/scripts/generate-release-notes.mjs "$RELEASE_TAG" "$RELEASE_BASE_TAG" > release-notes.md
          cat release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          RELEASE_TITLE="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
          fi
