name: 自动 PR 审核

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mock_test:
    name: 安装依赖并运行 Fraq 官方 mock 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 安装完整依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 Fraq 官方 mock 测试
        run: pnpm test:mock

  review-comment:
    name: 更新审核摘要
    needs: mock_test
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: 更新 PR 评论
        uses: actions/github-script@v9
        env:
          MOCK_TEST_RESULT: ${{ needs.mock_test.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- fraq-pr-review -->';
            const result = process.env.MOCK_TEST_RESULT;
            const passed = result === 'success';
            const status = passed ? '通过' : '失败';
            const body = [
              marker,
              '## 自动 PR 审核',
              '',
              `结果：${status}`,
              '',
              `Fraq 官方 mock 测试结果：${result}`,
              `PR 提交：${process.env.HEAD_SHA.slice(0, 7)}`,
              `工作流运行：${process.env.RUN_URL}`,
              '',
              passed ? 'Fraq 官方 mock 测试通过，可以进入人工审核。' : 'Fraq 官方 mock 测试失败，请查看工作流日志并修复问题。',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
